# FetchReach: move the gripper to a target. Trains in minutes.
# Hyperparameters follow RL Zoo's tuned SAC + HER settings for this task.

env_id: FetchReach-v4
seed: 0
timesteps: 50000  # 20k reached 74% and was still climbing

sac:
  learning_rate: 0.001
  batch_size: 256
  buffer_size: 1000000
  learning_starts: 1000
  gamma: 0.95
  tau: 0.05
  net_arch: [64, 64]

her:
  n_sampled_goal: 4
  goal_selection_strategy: future

eval:
  episodes: 100
  video_episodes: 3
