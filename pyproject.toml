[project]
name = "labrat"
version = "0.1.0"
description = "An AI agent that runs robot learning experiments"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.0",
    "gymnasium-robotics>=1.4.2",
    "hydra-core>=1.3.7",
    "imageio[ffmpeg]>=2.38.1",
    # Pinned: mujoco>=3.12 breaks gymnasium-robotics joint-type checks (enum vs int comparison)
    "mujoco>=3.11,<3.12",
    "optuna>=5.0.0",
    "pyyaml>=6.0.3",
    "stable-baselines3[extra]>=2.9.0",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
    "wandb>=0.31.0",
]
